<script>
    const SUPABASE_URL = "https://cxvpisumobcriyqrdvil.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dnBpc3Vtb2Jjcml5cXJkdmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNDg2NjIsImV4cCI6MjEwNTkyNDY2Mn0.cM8ssB_2ldnEZz4FfLK7EG_Clg3NtVKyEase98brFno";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let offlineTimer = null;

    // Fungsi Update UI (Waktu Menggunakan Jam Browser)
    function updateUI(data, isLive = false) {
      if (!data) return;
      document.getElementById('temp').innerText = data.temperature ?? '--';
      document.getElementById('hum').innerText = data.humidity ?? '--';
      document.getElementById('pm25').innerText = data.pm25 ?? '--';
      
      // Menggunakan waktu browser lokal Anda
      const waktuBrowser = new Date().toLocaleTimeString('id-ID');

      if (isLive) {
        document.getElementById('last-update').innerHTML = 
          `<span style="color: #2b6cb0; font-weight: bold;">🟢 Online (Realtime)</span> - Terakhir diperbarui: ${waktuBrowser}`;
        
        // Reset timer status offline
        clearTimeout(offlineTimer);
        offlineTimer = setTimeout(() => {
          document.getElementById('last-update').innerHTML = 
            `<span style="color: #e53e3e; font-weight: bold;">🔴 Raspberry Pi Offline / Terputus</span> - (Terakhir Aktif: ${waktuBrowser})`;
        }, 15000); // Jika 15 detik tidak ada sinyal -> OFFLINE

      } else {
        document.getElementById('last-update').innerHTML = 
          `<span style="color: #718096; font-weight: bold;">⚪ Memuat Data Terakhir...</span> (${waktuBrowser})`;
      }
    }

    // Pemuatan Data Awal dari Supabase
    async function loadInitialData() {
      const { data: latest } = await supabaseClient.from('sensor_logs').select('*').order('id', { ascending: false }).limit(1);
      if (latest && latest.length > 0) {
        updateUI(latest[0], false);
      }
      refreshTable();
    }

    async function refreshTable() {
      const { data: logs } = await supabaseClient.from('sensor_logs').select('*').order('id', { ascending: false }).limit(10);
      if (logs) {
        const tbody = document.getElementById('log-table');
        tbody.innerHTML = logs.map(row => `
          <tr>
            <td>${new Date(row.created_at).toLocaleString('id-ID')}</td>
            <td>${row.temperature ?? '--'}</td>
            <td>${row.humidity ?? '--'}</td>
            <td>${row.pm25 ?? '--'}</td>
          </tr>
        `).join('');
      }
    }

    // Download CSV
    async function downloadCSVFromSupabase() {
      const { data, error } = await supabaseClient.from('sensor_logs').select('*').order('created_at', { ascending: true });
      if (error || !data) { alert('Gagal mengunduh log.'); return; }

      let csvContent = "data:text/csv;charset=utf-8,Waktu,Suhu_C,Kelembaban_Pct,PM25\n";
      data.forEach(row => {
        csvContent += `${new Date(row.created_at).toLocaleString('id-ID')},${row.temperature},${row.humidity},${row.pm25}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `smartlab_datalog_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Realtime Broadcast Listeners
    supabaseClient
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_logs' }, () => refreshTable())
      .subscribe();

    supabaseClient
      .channel('realtime_sensor_room')
      .on('broadcast', { event: 'sensor_update' }, (payload) => {
        updateUI(payload.payload, true);
      })
      .subscribe();

    loadInitialData();
  </script>
